services:
  - type: web
    name: accesslayer
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "bash build_frontend.sh && pip install -r backend/requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT --workers 2"
    autoDeploy: true
    pythonVersion: "3.12.10"
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMAIL_FROM_NAME
        value: AccessLayer
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_POOLER_HOST
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_PHONE_NUMBER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
